name: MRWK bounty
description: Propose work that may receive an MRWK bounty.
title: "MRWK bounty: <amount> MRWK - <short scope>"
labels: ["mrwk:bounty"]
body:
  - type: textarea
    id: work
    attributes:
      label: Work needed
      description: Describe the useful accepted work.
    validations:
      required: true
  - type: input
    id: reward
    attributes:
      label: Proposed MRWK per award
      placeholder: "250"
    validations:
      required: true
  - type: input
    id: max_awards
    attributes:
      label: Max awards
      placeholder: "1"
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Explain what must be true before mrwk:accepted is applied. Include required evidence and relevant tests.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence or tests required
      description: List commands, files, URLs, screenshots, API responses, CI checks, or review evidence submitters should include.
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: List duplicate, broad, typo-only, stale, speculative, private-detail, or unrelated work that does not qualify.
