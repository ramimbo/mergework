{% extends "base.html" %}
{% block title %}Wallets{% endblock %}
{% block content %}
<h1>Wallets</h1>
<p class="lead">List of wallets.</p>

<form class="search-form" method="get" action="/wallets" role="search">
  <label for="wallets-q">Search wallets</label>
  <div class="search-row">
    <input id="wallets-q" name="q" value="{{ query }}" placeholder="address, GitHub login">
    <button type="submit">Search</button>
    {% if query %}<a href="{{ clear_wallets_url }}">Clear</a>{% endif %}
  </div>
</form>
{% if query %}
<p class="notice">Showing wallets matching "{{ query|e }}".</p>
{% endif %}
<nav class="actions detail-actions" aria-label="Wallets inspection links">
  <a href="{{ api_wallets_url }}">View JSON wallets</a>
</nav>

<section>
  <h2>Wallets</h2>
  {% if wallets %}
  <div class="ledger-list">
    {% for wallet in wallets %}
