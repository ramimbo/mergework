        '201':
          description: Attempt registered.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  status:
                    type: string
                  attempt:
                    type: object
                    additionalProperties: true
                    properties:
                      id:
                        type: integer
                        minimum: 1
                      bounty_id:
                        type: integer
                        minimum: 1
                      submitter_account:
                        type: string
                      source_url:
                        type: string
                        nullable: true
                      status:
                        type: string
                      expires_at:
                        type: string
                      created_at:
                        type: string
                      updated_at:
                        type: string
                  warnings:
                    type: array
                    items:
                      type: string
        '409':
          description: Attempt unavailable or duplicate active attempt.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  status:
                    type: string
                  bounty_id:
                    type: integer
                    minimum: 1
                  attempt:
                    type: object
                    additionalProperties: true
                    properties:
                      id:
                        type: integer
                        minimum: 1
                      bounty_id:
                        type: integer
                        minimum: 1
                      submitter_account:
                        type: string
                      source_url:
                        type: string
                        nullable: true
                      status:
                        type: string
                      expires_at:
                        type: string
                      created_at:
                        type: string
                      updated_at:
                        type: string
                  warnings:
                    type: array
                    items:
                      type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              properties:
                submitter_account:
                  type: string
                  description: Optional github:<login> account; must match the signed-in GitHub login.
                source_url:
                  type: string
                  format: uri
                  description: Optional public work branch or pull request URL.
                ttl_seconds:
                  anyOf:
                  - type: integer
                    minimum: 60
                    maximum: 604800
                  - type: string
                    description: Integer value encoded as a string (60..604800).
                    pattern: ^(?:[6-9][0-9]|[1-9][0-9]{2,4}|[1-5][0-9]{5}|60[0-3][0-9]{3}|604[0-7][0-9]{2}|604800)$
                  default: 86400
                  description: Attempt lifetime in seconds, from 60 to 604800.
              description: Optional advisory attempt reservation payload.
